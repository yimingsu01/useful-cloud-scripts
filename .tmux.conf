bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-option -g history-limit 10000
set-option -a terminal-features 'xterm-256color:RGB'
set-option -sg escape-time 10
set-option -g focus-events on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-interval 5
set-option -g set-titles on
set-option -g set-titles-string "#S->#W"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set-option -g update-environment "SSH_AUTH_SOCK"
set -g set-clipboard on

# ---- prefix / pane navigation: local vs SSH ----

unbind-key -q C-b
unbind-key -q C-g
unbind-key -q C-u

unbind-key -q -n M-h
unbind-key -q -n M-j
unbind-key -q -n M-k
unbind-key -q -n M-l
unbind-key -q -n M-i

unbind-key -q -n M-H
unbind-key -q -n M-J
unbind-key -q -n M-K
unbind-key -q -n M-L

if-shell '[ -n "$SSH_CONNECTION" ]' {
    # remote / SSH
    set-option -g prefix C-u
    bind-key C-u send-prefix

    # Meta + Shift + h/j/k/l
    bind-key -n M-H select-pane -L
    bind-key -n M-J select-pane -D
    bind-key -n M-K select-pane -U
    bind-key -n M-L select-pane -R
    bind-key -n M-P previous-window
    bind-key -n M-N next-window
} {
    # local
    set-option -g prefix C-g
    bind-key C-g send-prefix

    # Meta + h/l/i/k
    bind-key -n M-h select-pane -L
    bind-key -n M-l select-pane -R
    bind-key -n M-i select-pane -U
    bind-key -n M-k select-pane -D
    bind-key -n M-p previous-window
    bind-key -n M-n next-window
}

set -g mouse on
set-option -g allow-rename off

# ---- style ----

# layout theme-independent
set -g status-position bottom
set -g status-justify left

set -g status-left ''
set -g status-left-length 10

set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-format ' #I #W #F '

# ---- theme: choose colors based on whether this is an SSH session ----

if-shell '[ -n "$SSH_CONNECTION" ]' {
    # ===== remote / SSH theme blue / cyan =====

    # panes
    set -g pane-border-style 'fg=blue'
    set -g pane-active-border-style 'fg=cyan'

    # statusbar
    set -g status-style 'fg=cyan'
    set -g status-right-style 'fg=black bg=cyan'

    setw -g window-status-current-style 'fg=black bg=cyan'

    setw -g window-status-style 'fg=cyan bg=black'
    setw -g window-status-format ' #I #[fg=white]#W #[fg=blue]#F '

    setw -g window-status-bell-style 'fg=cyan bg=blue bold'

    # messages
    set -g message-style 'fg=cyan bg=blue bold'

    # copy mode
    setw -g mode-style 'fg=black bg=cyan bold'
} {
    # ===== local theme red / yellow =====

    # panes
    set -g pane-border-style 'fg=red'
    set -g pane-active-border-style 'fg=yellow'

    # statusbar
    set -g status-style 'fg=red'
    set -g status-right-style 'fg=black bg=yellow'

    setw -g window-status-current-style 'fg=black bg=red'

    setw -g window-status-style 'fg=red bg=black'
    setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

    setw -g window-status-bell-style 'fg=yellow bg=red bold'

    # messages
    set -g message-style 'fg=yellow bg=red bold'

    # copy mode
    setw -g mode-style 'fg=black bg=red bold'
}

set -g pane-border-status bottom
bind-key < command-prompt -p "pane title:" -I "#{pane_title}" "select-pane -T '%%'"
